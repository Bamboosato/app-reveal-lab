name: CI

on:
  push:
    branches: [ main, fix/*, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (svelte-check)
        run: npm run check

      - name: Run unit tests (node --test)
        run: npm test

      - name: Build project (vite build)
        run: npm run build
